name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.7.2"
  # SHA-512 of Godot_v4.7.2-stable_linux.x86_64.zip from the official SHA512-SUMS.txt.
  # Update together with GODOT_VERSION.
  GODOT_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download and verify Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          zip_name="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "/tmp/${zip_name}" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${zip_name}"
          echo "${GODOT_SHA512}  /tmp/${zip_name}" | sha512sum --check --strict
          mkdir -p ~/godot
          unzip -q "/tmp/${zip_name}" -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --import

      - name: Run tests
        run: |
          mkdir -p reports
          godot --headless -s addons/gut/gut_cmdln.gd -gjunit_xml_file=res://reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml
          if-no-files-found: warn

      # Smoke run of the strategy bots. Corridor misses only warn until balancing is done
      # (prototyp-plan.md section 10); remove --warn-only to make them fail the build.
      - name: Run strategy bots
        run: godot --headless -s src/tools/run_bots.gd -- --runs=20 --warn-only

      - name: Upload bot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-results
          path: reports/bots/
          if-no-files-found: warn
